<?xml version="1.0" encoding="UTF-8"?>
<svg width="600px" height="400px" viewBox="0 0 600 400" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>DocStory Example Image</title>
    <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="linearGradient-1">
            <stop stop-color="#6C9EFF" offset="0%"></stop>
            <stop stop-color="#4078FF" offset="100%"></stop>
        </linearGradient>
        <rect id="path-2" x="0" y="0" width="600" height="400" rx="24"></rect>
        <pattern id="pattern-3" width="20" height="20" x="-10" y="-10" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="2" fill="rgba(255,255,255,0.2)"></circle>
        </pattern>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <mask id="mask-4" fill="white">
            <use xlink:href="#path-2"></use>
        </mask>
        <use id="Rectangle" fill="url(#linearGradient-1)" xlink:href="#path-2"></use>
        <rect id="Rectangle" fill="url(#pattern-3)" mask="url(#mask-4)" x="0" y="0" width="600" height="400"></rect>
        <g transform="translate(60, 60)" mask="url(#mask-4)">
            <rect fill="#FFFFFF" x="0" y="0" width="480" height="280" rx="12"></rect>
            <rect fill="#F5F5F5" x="20" y="20" width="160" height="20" rx="4"></rect>
            <rect fill="#E0E0E0" x="20" y="50" width="440" height="1"></rect>
            <rect fill="#F5F5F5" x="20" y="70" width="120" height="20" rx="4"></rect>
            <rect fill="#F5F5F5" x="20" y="100" width="300" height="16" rx="4"></rect>
            <rect fill="#F5F5F5" x="20" y="126" width="280" height="16" rx="4"></rect>
            <rect fill="#F5F5F5" x="20" y="152" width="320" height="16" rx="4"></rect>
            <rect fill="#6C9EFF" x="20" y="190" width="120" height="40" rx="8"></rect>
            <rect fill="#F5F5F5" x="20" y="240" width="140" height="20" rx="4"></rect>
        </g>
    </g>
</svg> 